[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vball"
version = "0.1.0"
description = "Volleyball video analysis: ball tracking, court registration, landing and scoring"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "opencv-python-headless", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120  # ruff format wraps code here
target-version = "py312"
extend-exclude = ["external", "private", "webapp/frontend", "notebooks"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade
select = ["F", "E", "W", "I", "B", "UP"]
# B008: frozen config dataclasses as default arguments are intended (immutable)
ignore = ["B008", "B905"]  # B905: zips of equal-length sequences by construction

[tool.ruff.lint.isort]
known-first-party = ["vball"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150  # comments and strings the formatter cannot wrap

[tool.pytest.ini_options]
testpaths = ["tests", "webapp/backend/tests"]

[tool.coverage.run]
source = ["vball", "vball_app"]

[tool.mypy]
files = ["src/vball", "webapp/backend/vball_app"]
python_version = "3.12"
ignore_missing_imports = true  # ultralytics, onnxruntime, sklearn, scipy ship no or partial stubs
warn_unused_ignores = true

# Type debt (2026-10-13): modules with errors when mypy was introduced, mostly OpenCV / ultralytics stub mismatches
# and dicts of mixed values. Remove a module from this list once it checks clean; nothing may be added to it.
[[tool.mypy.overrides]]
module = [
    "vball.ball_detect",
    "vball.ball_track",
    "vball.calibration",
    "vball.camera_motion",
    "vball.court_keypoints",
    "vball.court_lines",
    "vball.court_registration",
    "vball.players",
    "vball.rally_cues",
    "vball.teams",
    "vball.trajectory",
]
ignore_errors = true
