name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # the vball package plus the web app backend package; model weights are not needed by the tests
      - run: pip install -e . -e webapp/backend -r webapp/requirements.txt pytest-cov ruff mypy types-PyYAML
      - run: ruff check src scripts tests webapp/backend
      - run: ruff format --check src scripts tests webapp/backend
      # vball and vball_app; modules still carrying type debt are listed in pyproject.toml
      - run: mypy
      # one run over both suites (the pipeline's stage tests drive it through the API); coverage gate over vball and
      # vball_app together: a change that drops below it fails the build (2026-10-13: 92%)
      - run: pytest -q --cov --cov-report=term --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
