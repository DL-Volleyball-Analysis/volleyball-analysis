name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # the vball package plus the web app backend; model weights are not needed by the tests
      - run: pip install -e . -r webapp/requirements.txt pytest-cov ruff
      - run: ruff check src scripts tests webapp/backend
      # coverage gates: a change that drops below them fails the build (2026-10-11: vball 94%, backend 94%)
      - run: pytest -q tests --cov=vball --cov-report=term --cov-fail-under=90
      - run: pytest -q webapp/backend/tests --cov=webapp/backend --cov-report=term --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
