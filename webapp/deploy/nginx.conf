# The review UI, with /api/... passed to the API without the prefix (as the Vite dev server does).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 8g;  # full-match uploads

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_buffering off;       # job progress is a server-sent event stream
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;  # client-side routes
    }
}
