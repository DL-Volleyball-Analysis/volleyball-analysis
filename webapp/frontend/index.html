<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volleyball Analysis</title>
    <script>
      // Apply the viewer's saved theme before first paint (light by default); see src/ui/theme.ts
      try { if (localStorage.getItem('vball-theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
